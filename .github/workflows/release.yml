name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/PhotoAnalysis.Worker/requirements.txt

      - name: Validate version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw 'Tag and application version do not match.'
          }

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install -r python/PhotoAnalysis.Worker/requirements.txt
          choco install innosetup --no-progress -y

      - name: Build release
        shell: pwsh
        run: ./build/build-release.ps1 -BuildWorker

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SnapSort ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/release/SnapSort_Setup_${{ github.ref_name }}.exe
            artifacts/release/SnapSort_${{ github.ref_name }}.zip
